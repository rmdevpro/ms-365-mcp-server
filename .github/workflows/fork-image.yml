# Fork-only: build this branch into a test image on GHCR. Not part of any upstream change.
name: fork-image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: image tag
        required: true
        default: log-no-content
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/rmdevpro/ms-365-mcp-server:${{ inputs.tag }}
      - run: docker buildx imagetools inspect ghcr.io/rmdevpro/ms-365-mcp-server:${{ inputs.tag }} | head -5
